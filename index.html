<style>:root{
  --jb-bg:#141413; --jb-panel:#1c1c1b; --jb-fg:#f0efea; --jb-dim:#a3a29c; --jb-line:#34332f;

html,body{height:100%}
body{background:var(--jb-bg);color:var(--jb-fg);font-family:var(--jb-f);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;margin:0;

.calc-wrap{max-width:440px;margin:0 auto;background:var(--jb-panel);border:1px solid var(--jb-line);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.calc-wrap .top{display:flex;justify-content:space-between;align-items:center}
.calc-wrap h1{font-size:18px;margin:0;font-weight:500}
.calc-wrap .reset{background:none;border:none;color:var(--jb-dim);cursor:pointer;padding:4px;display:grid;place-items:center;border-radius:8px}
.calc-wrap .reset svg{width:21px;height:21px}
.calc-wrap label{display:block;font-size:13px;color:var(--jb-dim);margin-bottom:3px}
.calc-wrap .field{font:inherit;width:100%;box-sizing:border-box;background:transparent;color:var(--jb-fg);border:1px solid var(--jb-line);border-radius:10px;padding:6px 12px;font-size:21px;font-weight:500}
.calc-wrap .field:focus,.calc-wrap .pill input:focus,.calc-wrap select:focus{outline:2px solid var(--jb-accent);outline-offset:1px}
.calc-wrap .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.calc-wrap .taxbox{background:var(--jb-accent-bg);color:var(--jb-accent-fg);border-radius:10px;padding:0 12px;height:42px;display:flex;align-items:center;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calc-wrap .taxbox.warn{background:var(--jb-warn-bg);color:var(--jb-warn)}
.calc-wrap .taxbox select{font:inherit;font-size:15px;color:inherit;background:transparent;border:none;width:100%;padding:0;-webkit-appearance:none;appearance:none}
.calc-wrap .card{border:1px solid var(--jb-line);border-radius:14px;padding:6px 13px 7px}
.calc-wrap .card.hm{border-style:dashed}
.calc-wrap .head{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--jb-dim)}
.calc-wrap .pill{display:inline-flex;align-items:center;gap:2px;font-size:14px;color:var(--jb-dim)}
.calc-wrap .pill input{font:inherit;font-weight:500;color:inherit;width:3.8em;text-align:right;background:transparent;border:1px solid var(--jb-line);border-radius:6px;padding:1px 3px}
.calc-wrap .total{margin:0 0 2px}
.calc-wrap .amtrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.calc-wrap .amt{font-size:22px;font-weight:600}
.calc-wrap .total small{font-size:13px;font-weight:400;color:var(--jb-dim)}
.calc-wrap .loan{color:var(--jb-dim);font-size:13px;white-space:nowrap}
.calc-wrap .save{font-size:13px;font-weight:500;color:var(--jb-save);margin-top:1px}
.calc-wrap .taxamt{font-size:13px;font-weight:400;color:var(--jb-dim);margin-top:1px}
.calc-wrap .pays{display:flex;flex-direction:column;gap:0;font-size:14px;line-height:1.35;border-top:1px solid var(--jb-line);padding-top:3px;margin-top:2px}
.calc-wrap .pays div{display:flex;justify-content:space-between}
html,body{overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box}
.calc-wrap input,.calc-wrap select,.calc-wrap .pill input{font-size:16px!important}
.calc-wrap .field{font-size:21px!important}

.calc-wrap{padding:8px 12px!important;gap:5px!important}
.calc-wrap h1{font-size:17px!important}
.calc-wrap label{font-size:12px!important;margin-bottom:2px!important}
.calc-wrap .field{padding:4px 10px!important;font-size:19px!important}
.calc-wrap .taxbox{height:36px!important;font-size:15px!important}
.calc-wrap .card{padding:4px 11px 5px!important}
.calc-wrap .head{font-size:14px!important}
.calc-wrap .amt{font-size:20px!important}
.calc-wrap .save,.calc-wrap .taxamt,.calc-wrap .loan{font-size:12px!important}
.calc-wrap .pays{font-size:13.5px!important;line-height:1.2!important}
.calc-wrap .pill input{padding:0 3px!important}
body{padding-top:calc(4px + env(safe-area-inset-top,0px))!important;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))!important}

html,body{height:100%}
body{display:flex;flex-direction:column}
#app{flex:1;display:flex;min-height:0}
.calc-wrap{flex:none;align-self:flex-start;width:100%;max-width:560px!important;box-sizing:border-box}

.calc-wrap .head>span:first-child{white-space:nowrap}
.calc-wrap .card.hm{border-style:solid!important}

/* polish */
.calc-wrap{--x:0px}
.calc-wrap{gap:calc(5px + var(--x))!important}
.calc-wrap .card{padding:calc(5px + var(--x)) 12px calc(6px + var(--x))!important}
.calc-wrap .pill input{width:2.9em!important;text-align:center!important;padding:1px 2px!important}
.calc-wrap .head{font-size:14px!important}
.calc-wrap .head>span:first-child{color:#d6d5cf;font-weight:600;letter-spacing:.01em}
.calc-wrap .pays{font-size:14px!important;line-height:1.45!important;padding-top:4px!important;margin-top:4px!important}
.calc-wrap .pays span:first-child{color:var(--jb-dim)}
.calc-wrap .pays span:last-child{font-weight:500}
.calc-wrap .amt.empty{color:var(--jb-dim);opacity:.45}
.calc-wrap .pays .empty span{opacity:.45}
body{padding-top:calc(16px + env(safe-area-inset-top,0px))!important}
